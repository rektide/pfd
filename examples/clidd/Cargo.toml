[package]
name = "clidd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference daemon example for clid"

[[bin]]
name = "clidd"
path = "src/main.rs"

[features]
default = ["prefork"]
prefork = ["dep:prefork"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env"] }
clid-context = { path = "../../clid-context" }
clid-daemon = { path = "../../clid-daemon" }
clid-discovery = { path = "../../clid-discovery" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "net", "io-util", "signal", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
prefork = { version = "0.6", optional = true }
