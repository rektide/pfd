[package]
name = "clid-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Daemon library for clid CLI→daemon execution hand-off"

[features]
default = []
prefork = ["dep:prefork"]
local = ["clid-discovery/local"]

[dependencies]
anyhow.workspace = true
clid-context = { path = "../clid-context" }
clid-discovery = { path = "../clid-discovery" }
rkyv = { version = "0.8", features = ["bytecheck"] }
sendfd = { version = "0.4", features = ["tokio"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "net", "io-util", "signal", "time"] }
tracing.workspace = true
prefork = { version = "0.6", optional = true }
